[package]
name = "biosphere-terminal-app"
version = "0.1.0"
description = "Biosphere Terminal - Visual Terminal Application"
authors = ["Biosphere Team"]
edition = "2021"

[lib]
name = "biosphere_terminal_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"

tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"

rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
dirs-next = "2.0"
hostname = "0.4"
portable-pty = "0.8"
anyhow = "1"

[workspace]
